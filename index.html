<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- הגדרות חובה להפיכת הדף לאפליקציית מסך בית ב-iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OverDrive App</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        #loading { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-family: system-ui, -apple-system, sans-serif; font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div id="loading">מתחבר לרכב...</div>
    <iframe id="app-frame" style="display: none;" allow="fullscreen"></iframe>

    <script>
        // הגדרת הכתובות לפי סדר העדיפות שרצית
        const urlWifi = "http://192.168.33.20:8080";
        const urlWG = "http://10.192.1.20:8080";
        const urlZrok = "https://overdriveisc4og.share.zrok.io";
        
        const frame = document.getElementById('app-frame');
        const loader = document.getElementById('loading');

        // פונקציה לבדיקת זמינות כתובת ברקע ללא בעיות CORS
        function checkNetwork(url) {
            return new Promise((resolve, reject) => {
                fetch(url, { mode: 'no-cors', signal: AbortSignal.timeout(1000) })
                    .then(() => resolve(true))
                    .catch(() => reject(false));
            });
        }

        // טעינת הכתובת לתוך המסגרת והעלמת מסך הטעינה
        function loadApp(url) {
            loader.style.display = 'none';
            frame.style.display = 'block';
            frame.src = url;
        }

        // לוגיקת הניתוב
        async function init() {
            try {
                await checkNetwork(urlWifi);
                loadApp(urlWifi);
                return;
            } catch(e) {}

            try {
                await checkNetwork(urlWG);
                loadApp(urlWG);
                return;
            } catch(e) {}

            // אם שתי הכתובות הפנימיות לא ענו, נופל לכתובת הציבורית
            loadApp(urlZrok);
        }

        init();
    </script>
</body>
</html>
